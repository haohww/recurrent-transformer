name: QLess appointment watch

# Checks the kiosk for an appointment earlier than the cutoff and books it.
# Runs entirely on GitHub's runners, so it keeps going with your laptop off.
on:
  schedule:
    # Every 5 minutes -- GitHub's minimum. The scheduler is best-effort and
    # skips runs when busy, so each run also re-checks a few times internally
    # (QLESS_ROUNDS x QLESS_ROUND_SLEEP) to keep the real gap near 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Walk the flow but stop before confirming
        type: boolean
        default: false
      cutoff_date:
        description: Book only slots earlier than this (YYYY-MM-DD)
        required: false
        default: '2026-10-26'

# Never let two runs try to book at the same time.
concurrency:
  group: qless-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write # to disable this workflow once an appointment is booked

jobs:
  watch:
    # Off until the repository variable QLESS_ENABLED is set to "true".
    # The flow's selectors have to be confirmed against the live site with a
    # dry run first; until then a scheduled run would just fail every five
    # minutes. Turn it on with:
    #   gh variable set QLESS_ENABLED --body true
    if: vars.QLESS_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check for an earlier appointment
        id: probe
        continue-on-error: true
        env:
          QLESS_KIOSK_URL: ${{ vars.QLESS_KIOSK_URL || 'https://kiosk.na1.qless.com/kiosk/app/home/100100000129' }}
          QLESS_SERVICE: ${{ vars.QLESS_SERVICE || 'alien firearm' }}
          QLESS_CUTOFF_DATE: ${{ inputs.cutoff_date || vars.QLESS_CUTOFF_DATE || '2026-10-26' }}
          QLESS_FIRST_NAME: ${{ secrets.QLESS_FIRST_NAME }}
          QLESS_LAST_NAME: ${{ secrets.QLESS_LAST_NAME }}
          QLESS_PHONE: ${{ secrets.QLESS_PHONE }}
          QLESS_EMAIL: ${{ secrets.QLESS_EMAIL }}
          QLESS_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          QLESS_ROUNDS: ${{ vars.QLESS_ROUNDS || '3' }}
          QLESS_ROUND_SLEEP: ${{ vars.QLESS_ROUND_SLEEP || '90' }}
          QLESS_MAX_DAYS: ${{ vars.QLESS_MAX_DAYS || '60' }}
        run: |
          set +e
          python tools/qless/probe.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 10 means booked; 0 means nothing available. Anything else is a bug.
          [ "$code" = 10 ] || [ "$code" = 0 ]

      # Screenshots and DOM dumps of every step -- this is how a broken
      # selector gets diagnosed without re-running blind.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe-out/
          retention-days: 14

      - name: Announce the booking and stop watching
        if: steps.probe.outputs.exit_code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          details=$(cat probe-out/booked.json 2>/dev/null || echo '(dry run -- nothing confirmed)')
          gh issue create \
            --title "QLess: appointment booked" \
            --body "$(printf 'An earlier appointment slot was taken.\n\n```json\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n\nVerify it in the confirmation email, then re-enable this workflow if it was a false positive.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
              "$details" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          # Booked once -- do not let the schedule book a second appointment.
          gh workflow disable "qless-watch.yml" || true

      - name: Fail the run if the probe errored
        if: steps.probe.outcome == 'failure'
        run: |
          echo "probe exited ${{ steps.probe.outputs.exit_code }} -- see the probe-out artifact"
          exit 1
